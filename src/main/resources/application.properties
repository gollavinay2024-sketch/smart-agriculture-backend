server.port=8080

# Application Name
spring.application.name=smart-agriculture-backend

# Default active profile (dev uses file-persisted H2, prod uses MySQL)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate Defaults
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Weather API (Open-Meteo - No API Key Required)
app.weather.forecast-api-url=${WEATHER_FORECAST_API_URL:https://api.open-meteo.com/v1/forecast}
app.weather.geocoding-api-url=${WEATHER_GEOCODING_API_URL:https://geocoding-api.open-meteo.com/v1/search}
app.weather.timeout-seconds=8

# Configurable Rain Risk Thresholds
app.risk.high-probability-threshold=70.0
app.risk.medium-probability-threshold=40.0
app.risk.high-rainfall-threshold=5.0
app.risk.medium-rainfall-threshold=1.5
app.risk.high-wind-threshold=35.0

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
